{% extends 'base.html' %}
{% block title %}Login — Edcar Properties{% endblock %}
{% block content %}
<div style="min-height:85vh;display:flex;align-items:center;padding:3rem 0;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="text-center mb-4">
                    <h2 style="font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:700;">Welcome Back</h2>
                    <p style="color:var(--text2);">Login to your Edcar Properties account</p>
                </div>
                <div class="card p-4">
                    <form method="POST" action="{{ url_for('auth.login') }}">
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" name="email" class="form-control" placeholder="your@email.com" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" placeholder="Your password" required>
                        </div>
                        <button type="submit" class="btn btn-gold w-100 py-2">Login</button>
                    </form>
                    <hr style="border-color:var(--border);" class="my-3">
                    <p class="text-center mb-0" style="font-size:0.9rem;color:var(--text2);">
                        No account? <a href="{{ url_for('auth.register') }}" style="color:var(--gold);">Register here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
